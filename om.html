
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My home </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
            color: #333;
        }

        /* Header */
        header {
            background-color: #336699;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Navigation */
        nav {
            background-color: #333;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover {
            color: lightblue;
        }

        /* Main Content */
        main {
            padding: 25px;
            text-align: center;
        }

        .about {
            background-color: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            border: 1px solid #ddd;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 12px;
        }

        @media (max-width: 500px) {
            nav a {
                display: inline-block;
                margin: 5px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome To My Home</h1>
        <p>A Simple Website Using HTML and CSS</p>
    </header
